extends: strict_medium_norules_grounded_cleanctx_gpt4o_mini

# Rewrite an existing trace file instead of sampling new rows. This is meant to
# improve collaborator-generated SynthPert-like traces while preserving their
# useful row distribution.
prompts: teacher/synthpert_refine_grounded
workers: 2

teacher:
  model: gpt-4o-mini
  temperature: 0.35
  max_tokens: 2200

critic:
  model: gpt-4o-mini
  min_score: 4
  max_tokens: 240

