# =============================================================================
# bioreason_sft — Track C: reasoning distillation -> GRPO
#
#   pixi install                 # solve + install the V100/default env
#   pixi run check-gpu-v100      # verify CUDA/torch on a V100 node
#   pixi run -e h100 check-gpu-h100  # later: verify Unsloth/bnb on H100
#   pixi run pipeline-smoke      # data -> grounding -> 30 traces
#   pixi shell                   # drop into the env
#
# Why pixi here: this stack breaks at the conda/PyPI boundary (torch CUDA build
# vs optional bitsandbytes/Unsloth). Pixi locks BOTH sides in one pixi.lock, so
# login-node prep and GPU training cannot silently diverge.
# =============================================================================

[workspace]
name = "bioreason_sft"
version = "0.1.0"
description = "CRISPRi perturbation prediction: reasoning distillation + GRPO"
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12.4" }]

# The default env is V100-compatible: standard Torch + Transformers + PEFT.
# The optional h100 env adds Unsloth/bitsandbytes and should be used only on
# newer GPUs after NAIRR/H100 access is available.
# torch CUDA wheels do not live on PyPI proper.
[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu124"]


# ── conda side: interpreter + scientific stack ──────────────────────────────
# These resolve better from conda-forge than PyPI (compiled BLAS etc).
[dependencies]
python = "3.12.*"
pip = ">=24.0"
numpy = ">=1.26,<3"
# pandas 3.x dropped the `parquet` extra some packages still request, and the
# PyPI/conda pandas can end up installed side by side. Stay on 2.x: nothing here
# needs 3.x, and `datasets` is happier.
pandas = ">=2.1,<3"
pyarrow = ">=15"              # requested transitively; get it from conda-forge
scipy = ">=1.11"
scikit-learn = ">=1.4"        # roc_auc_score — the competition metric
pyyaml = ">=6.0"              # config system
requests = ">=2.31"           # teacher API + mygene.info
matplotlib = ">=3.8"          # GRPO val-curve plot in the notebook
tqdm = ">=4.66"
git = "*"                     # some pip installs need it


# ── PyPI side: the base ML stack ────────────────────────────────────────────
# Keep the default env compatible with Expanse V100. H100-only accelerators live
# in feature.h100 below.
[pypi-dependencies]
torch = ">=2.5,<2.9"          # cu124 wheels via the extra index above
transformers = ">=4.51"
trl = ">=0.12"                # SFTTrainer + GRPOTrainer
peft = ">=0.13"               # LoRA / PeftModel.from_pretrained
datasets = ">=3.0"
accelerate = ">=1.0"
sentencepiece = "*"           # Gemma tokenizer
protobuf = "*"                # ditto
huggingface-hub = ">=0.26"

# NOTE: decoupler/omnipath are deliberately NOT here. We used decoupler for one
# call (dc.op.collectri) — a download. It depends on numba, and the resolver
# backtracks to numba 0.53.1, which has no py3.12 wheel and fails its own build
# guard ("only versions >=3.6,<3.10 supported"). build_grounding.py now fetches
# CollecTRI straight from OmniPath's REST API with `requests`. If you want the
# library anyway: pixi run -e grounding-decoupler grounding
#   (and set sources.collectri.method: decoupler)

# data access
kagglehub = ">=0.3"           # understands the NEW Kaggle token flow
kaggle = ">=1.6"              # CLI fallback


# ── environment variables ───────────────────────────────────────────────────
[activation.env]
TOKENIZERS_PARALLELISM = "false"        # silences the fork warning during eval
# Keep the HF cache next to the project, not in $HOME (cluster quotas).
HF_HOME = "$PIXI_PROJECT_ROOT/../.hf_cache"
# paths.py derives ROOT from the package location, so MLGENX_ROOT is optional.
# Uncomment to override (e.g. if you symlink the code elsewhere):
# MLGENX_ROOT = "$PIXI_PROJECT_ROOT/.."


# ── optional features ───────────────────────────────────────────────────────
# pixi run -e nb notebook          (jupyter)
# pixi run -e wandb sft            (metric logging)
# pixi run -e full  ...            (both)

[feature.nb.dependencies]
jupyterlab = ">=4.0"
ipykernel = ">=6.29"
ipywidgets = ">=8.1"

[feature.wandb.pypi-dependencies]
wandb = ">=0.18"

[feature.dev.dependencies]
ipython = "*"
ruff = "*"

[feature.h100.pypi-dependencies]
# H100/NAIRR path. Do not use this env on Expanse V100: bitsandbytes 4-bit needs
# Turing+ and Unsloth kernels are not the right target for sm_70.
unsloth = ">=2025.1"
unsloth_zoo = ">=2025.1"
bitsandbytes = ">=0.44"

# Optional decoupler path for grounding. Kept in its OWN solve group so its numba
# constraint can never drag the training env backwards. CPU-only, login node.
[feature.grounding-decoupler.dependencies]
numba = ">=0.60"              # pin forward: 0.59+ is the first with py3.12 wheels
[feature.grounding-decoupler.pypi-dependencies]
decoupler = ">=1.8"
omnipath = ">=1.0"

[environments]
default = { solve-group = "v100" }
v100    = { solve-group = "v100" }
nb      = { features = ["nb"], solve-group = "main" }
wandb   = { features = ["wandb"], solve-group = "main" }
full    = { features = ["nb", "wandb", "dev"], solve-group = "main" }
h100    = { features = ["h100"], solve-group = "h100" }
# separate solve group on purpose — see the comment above
grounding-decoupler = { features = ["grounding-decoupler"] }


# ── tasks: the whole pipeline ───────────────────────────────────────────────
# Run in order. Stages 0-2 are CPU + internet (login node); 3-4 need a GPU.
[tasks]

# -- diagnostics -------------------------------------------------------------
paths = { cmd = "python paths.py", description = "show layout + existing runs" }

check-gpu-v100 = { cmd = """
python -c "
import torch, sys
print('torch     ', torch.__version__)
print('cuda avail', torch.cuda.is_available())
if not torch.cuda.is_available(): sys.exit('NO GPU VISIBLE')
cc = torch.cuda.get_device_capability(0)
print('device    ', torch.cuda.get_device_name(0), f'(sm_{cc[0]}{cc[1]})')
print('bf16      ', torch.cuda.is_bf16_supported())
if cc[0]*10+cc[1] < 70:
    sys.exit('FATAL: compute capability <7.0')
import transformers, peft, trl
print('transformers', transformers.__version__)
print('OK')
"
""", description = "verify CUDA + Torch + Transformers on V100/default env" }

check-gpu-h100 = { cmd = """
python -c "
import torch, sys
print('torch     ', torch.__version__)
print('cuda avail', torch.cuda.is_available())
if not torch.cuda.is_available(): sys.exit('NO GPU VISIBLE')
cc = torch.cuda.get_device_capability(0)
print('device    ', torch.cuda.get_device_name(0), f'(sm_{cc[0]}{cc[1]})')
print('bf16      ', torch.cuda.is_bf16_supported())
if cc[0]*10+cc[1] < 75:
    sys.exit('FATAL: compute capability <7.5 — bitsandbytes 4-bit needs Turing+, '
             'Unsloth needs newer kernels. Use H100/A100/T4, not V100.')
import bitsandbytes, unsloth
print('bitsandbytes', bitsandbytes.__version__)
print('OK')
"
""", description = "verify CUDA + compute capability + bitsandbytes/Unsloth on H100 env" }

# -- stage 0-2: CPU + internet, run on the login node ------------------------
data = { cmd = "python download_data.py", description = "download Kaggle data -> ../data" }

grounding = { cmd = "python build_grounding.py --out default", depends-on = ["data"], description = "mygene + CollecTRI -> ../output/grounding/default" }

traces-smoke = { cmd = "python build_traces.py --out smoke --config smoke", depends-on = ["grounding"], description = "30 traces. ALWAYS run this first and READ them." }

traces = { cmd = "python build_traces.py --out default --config default", depends-on = ["grounding"], description = "full trace generation (~1-3h, resumable)" }

# -- stage 3-4: GPU ----------------------------------------------------------
sft-v100 = { cmd = "python train_sft_distill.py --config v100_4b --traces label-default --out qwen4b-v100", description = "V100 baseline SFT with fallback traces" }

sft = { cmd = "python train_sft_distill.py --config h100_8b --traces default --out qwen8b", description = "H100/NAIRR SFT path after access is available" }

sft-resume = { cmd = "python train_sft_distill.py --config h100_8b --traces default --out qwen8b --resume", description = "resume the qwen8b SFT run at its exact step" }

sft-control = { cmd = "python train_sft_distill.py --config label_only_ablation --traces default --out abl-labelonly", description = "SynthPert control: label-only SFT (no traces)" }

grpo = { cmd = "python train_grpo.py --config h100 --sft qwen8b --out qwen8b-grpo", description = "GRPO on top of the SFT adapter" }

# -- convenience -------------------------------------------------------------
pipeline-smoke = { depends-on = ["data", "grounding", "traces-smoke"], description = "everything cheap, end to end" }

notebook = { cmd = "jupyter lab pipeline.ipynb", description = "notebook version (use: pixi run -e nb notebook)" }

results = { cmd = """
python -c "
import json, pathlib, paths
rows=[]
for stage in ('sft','grpo'):
    d = paths.OUTPUT/stage
    for run in sorted([x for x in d.iterdir() if x.is_dir()] if d.exists() else []):
        mp = run/'metrics.json'
        if not mp.exists(): continue
        m = json.loads(mp.read_text())
        s = m.get('blocked_val_score') or m.get('best_blocked_val')
        rows.append((s if s is not None else -1, stage, run.name, m.get('traces_run') or m.get('sft_run')))
if not rows: print('no finished runs yet')
for s, stage, run, src in sorted(rows, reverse=True):
    print(f'{s:.4f}  {stage:5} {run:24} <- {src}')
"
""", description = "leaderboard of all local runs by blocked-val score" }

label-traces = { cmd = "python build_label_traces.py --out label-default --config v100_4b", description = "deterministic fallback traces from blocked train labels" }

submit = { cmd = "sbatch run_experiment.sbatch", description = "launch the SLURM experiment array" }
