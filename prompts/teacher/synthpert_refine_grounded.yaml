rules: |
  Use the context as private biological hints only. Use specific gene functions,
  protein classes, pathway membership, direct TF-target edges, and canonical
  regulatory modules when they are useful. Ignore vague ontology parents and
  weak shared-regulator hints.

  Rewrite the original rationale; do not merely paraphrase it. Keep useful
  factual anchors, remove vague filler, and repair weak mechanisms when a better
  canonical mechanism is available.

  Write in the style of strong SynthPert rationales:
  - One compact paragraph, 4-7 sentences.
  - Start with established biology for {pert} and {gene}.
  - For up/down, include a sign-producing route from {pert} knockdown to {gene}
    mRNA direction.
  - For no-change, explain the specific separation in pathway, compartment,
    regulatory level, or macrophage cell-state dependency.
  - Label indirect bridges as hypotheses.
  - Prefer canonical modules when relevant: IFN/JAK/STAT/IRF, TLR/MyD88/IRAK/
    TRAF/NF-kB/AP-1, TNF/NF-kB/MAPK, mTOR/TFEB, ISR/ATF4, p53/nucleolar stress,
    mitochondrial stress, spliceosome/RNA export, ribosome biogenesis,
    proteostasis/chaperone systems, vesicle trafficking, chromatin remodeling,
    macrophage lineage factors PU.1/IRF8/CIITA.
  - Do not invent promoter binding, direct regulation, named intermediates, or
    macrophage specificity unless well supported.

  Do not cite or mention context, databases, annotations, GO terms, labels,
  answer choices, thresholds, FDR, fold changes, training data, benchmark data,
  observed effects, statistical significance, or the original rationale.

refine: |
  You are an expert molecular and cellular biologist improving a synthetic
  rationale for supervised fine-tuning.

  Context available to the teacher:
  {context}

  Perturbed gene: {pert}
  Target gene: {gene}
  Association to rationalize: {meaning}

  Original rationale:
  {original_trace}

  Rewrite the rationale so it is more mechanistic, compact, biologically
  specific, and closer to the strongest SynthPert-style examples. Preserve the
  same association; do not add an answer label.

  {rules}

critic: |
  You are an expert molecular and cellular biologist evaluating a rewritten
  synthetic rationale for supervised fine-tuning.

  Judge whether the rationale is biologically accurate, specific, compact,
  coherent, and useful as mechanistic training data. Do not judge whether the
  requested expression direction is experimentally correct.

  Perturbed gene: {pert}
  Target gene: {gene}
  Requested association: {meaning}

  Context available to the teacher:
  {context}

  Rationale:
  {trace}

  Score 0-5:
  5 = excellent: accurate functions for both genes, compact SynthPert-style
      reasoning, and a specific sign-producing or no-change mechanism.
  4 = good: gene-specific and useful, with at most one cautious indirect bridge.
  3 = marginal: real functions are present, but the bridge is broad, weakly
      signed, or only partly specific.
  2 = weak: generic stress/homeostasis/pathway language, only one gene is
      specific, or the rationale mostly says there is no direct regulation.
  1 = bad: incorrect gene identity/function, invented direct regulation,
      unsupported promoter binding, or unsupported named intermediates stated as
      fact.
  0 = unusable: label/source/statistical leakage, answer-choice wording,
      contradiction, or rationale unrelated to the requested genes.

  Apply these limits:
  - If either gene's function is missing, wrong, or vague, score <= 2.
  - If a direct edge, promoter interaction, named response element, or named
    intermediate is invented as fact, score <= 1.
  - If the rationale cites or mentions context, databases, annotations, GO,
    labels, answer choices, thresholds, FDR, fold changes, training data,
    benchmark data, observed effects, statistical significance, or the original
    rationale, score 0.
  - For up/down, if no sign-producing step connects {pert} knockdown to {gene}
    mRNA direction, score <= 2.
  - For no-change, if it only says "no known direct regulation" without specific
    functional separation, score <= 2.
  - Speculative bridges can score 4 only when the factual anchors are concrete
    and uncertainty is explicitly calibrated.

  Reply only with valid JSON:
  {{"score": <int>, "reason": "<15 words or fewer>"}}

leak_patterns:
  - '\bgiven\s+(?:that|the)\s+(?:the\s+)?(?:answer|label|outcome|result|ground.?truth|conclusion)'
  - '\b(?:the|this)\s+(?:answer|label|outcome|response)\s+(?:is|was)\s+(?:given|provided|known|stated)'
  - '\bwe\s+(?:are told|know|were told)\s+that\b'
  - '\b(?:since|because|as)\s+(?:the\s+)?(?:correct\s+)?(?:answer|choice|label|outcome)\s+(?:is|was)\b'
  - '\bground.?truth\b'
  - '\bcorrect\s+(?:answer|label|choice)\b'
  - '\b(?:given|provided|supplied)\s+(?:answer|label|response|outcome)\b'
  - '\btraining\s+(?:screen|label|response|example|data)\b'
  - '\bbenchmark\s+threshold\b'
  - '\bbenchmark\b'
  - '\bFDR\b'
  - '\bfalse\s+discovery\s+rate\b'
  - '\blog2\s*(?:fold\s*change|FC)\b'
  - '\blog2FC\b'
  - '\bstatistical(?:ly)?\b'
  - '\bsignificant(?:ly)?\b'
  - '\bobserved\s+(?:increase|decrease|effect|response|change|upregulation|downregulation)\b'
  - '\bthe\s+provided\s+context\b'
  - '\bprovided\s+context\b'
  - '\bretrieved\s+(?:context|evidence|information)\b'
  - '\bexternal\s+context\b'
  - '\bcontext\s+(?:shows|suggests|states|indicates|provides)\b'
  - '\bdatabase(?:s)?\b'
  - '\bannotation(?:s)?\b'
  - '\bGO\s+terms?\b'
  - '\boriginal rationale\b'
