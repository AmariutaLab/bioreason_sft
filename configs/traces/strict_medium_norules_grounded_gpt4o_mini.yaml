extends: strict_medium

# Collaborator-requested SynthPert-like grounded variant:
# simple norules teacher prompt + gpt-4o-mini teacher + same permissive critic.
grounding:
  enabled: true

prompts: teacher/norules_grounded

teacher:
  model: gpt-4o-mini
  temperature: 0.45
  max_tokens: 2400

critic:
  model: gpt-4o-mini
  min_score: 3
  max_tokens: 200

filters:
  min_chars: 180
  require_gene_mentions: true
  reject_patterns:
    - '\bprovided context\b'
    - '\bretrieved context\b'
    - '\bexternal context\b'
    - '\bdatabase(?:s)?\b'
    - '\bannotation(?:s)?\b'
    - '\bGO terms?\b'
    - '\bsignificant(?:ly)?\s+(?:increased|decreased|changed|upregulated|downregulated)\b'
    - '\bobserved\s+(?:increase|decrease|effect|response|change)\b'

