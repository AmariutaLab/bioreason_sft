extends: strict_medium_norules_grounded_cleanctx_o4_mini

# Generate independent alternatives to collaborator's original o4-mini traces.
# The teacher does not see the original rationale; it sees cleaned grounding plus
# train-split perturbation/target neighborhood signatures.
prompts: teacher/synthpert_candidate_signature
workers: 2

teacher:
  model: o4-mini
  max_tokens: 2600

critic:
  model: gpt-4o-mini
  min_score: 4
  max_tokens: 240

signature:
  max_genes: 8

