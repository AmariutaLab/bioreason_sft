rules: |
  You are a molecular and cellular biology expert analyzing gene regulation upon
  CRISPRi knockdown.

  Write a mechanistic rationale, not a proof. Use the context as supporting
  evidence, but do not cite or mention the context, databases, annotations, GO,
  labels, answer choices, thresholds, FDR, fold changes, training data, or the
  benchmark.

  Consider mechanisms that are often relevant in CRISPRi screens: transcription
  factors and chromatin regulation, RNA processing and mRNA export, ribosome
  biogenesis and translation, mitochondrial function, ER or proteostatic stress,
  lysosome/autophagy pathways, macrophage immune signaling, metabolism, and
  cell-state-specific biology.

  Hard rules:
  - Mention both {pert} and {gene} by name.
  - Anchor the rationale in concrete functions or protein classes of both genes.
  - Use a signed direct edge only when the context or well-established biology
    supports that exact relationship.
  - If no exact direct edge is known, an indirect mechanism is acceptable when
    it follows from concrete biology of {pert} and {gene}.
  - It is acceptable to use broad mechanisms such as stress response,
    proteostasis, translation, mTOR, interferon/NF-kB/JAK-STAT signaling, or
    chromatin remodeling, but only when tied to the specific genes.
  - Distinguish factual anchors from plausible bridges. Use cautious language
    for uncertain intermediates.
  - Do not invent promoter binding, named response elements, or direct
    activation/repression unless they are well established.
  - Do not claim macrophage specificity unless it is established in macrophages
    or closely related myeloid cells.
  - Output only the rationale in 4-7 sentences. Do not include <think>,
    <answer>, bullets, or a final answer label.

prompt_de: |
  Context available to the teacher:
  {context}

  In mouse bone marrow-derived macrophages, CRISPRi reduction of {pert} is
  associated with {meaning} expression of {gene}.

  Explain why this response is biologically plausible. Start from the molecular
  role of {pert}, connect it to the molecular role or regulation of {gene}, and
  end with how the knockdown would shift {gene} mRNA in the requested direction.
  Prefer a concrete causal chain, but make uncertainty explicit when the bridge
  is indirect.

  {rules}

prompt_none: |
  Context available to the teacher:
  {context}

  In mouse bone marrow-derived macrophages, CRISPRi reduction of {pert} is
  associated with no detectable transcriptional change in {gene}.

  Explain why no clear directional response is biologically expected. Start from
  the molecular role of {pert}, compare it to the molecular role or regulation
  of {gene}, and explain why the knockdown does not create a strong signed route
  to altered {gene} mRNA. Prefer a specific separation of regulatory level,
  pathway, compartment, or cell-state dependency over saying the genes are
  simply unrelated.

  {rules}

critic: |
  You are a molecular and cellular biology expert evaluating synthetic
  rationales for supervised training. Judge whether the rationale is useful
  biological reasoning, not whether the requested expression direction is
  experimentally correct.

  Perturbed gene: {pert}
  Target gene: {gene}
  Requested association: {meaning}

  CONTEXT:
  {context}

  RATIONALE:
  {trace}

  Score 0-5:
  5 = strong mechanistic rationale: both gene functions are accurate, the
      causal chain is specific, and any uncertainty is well calibrated.
  4 = good rationale: biologically useful and specific, with one underspecified
      step or a cautious indirect bridge.
  3 = usable rationale: anchored in real functions of both genes, but the bridge
      is speculative or broad. This is acceptable for sparse up/down biology
      when uncertainty is explicit.
  2 = weak rationale: generic stress/pathway prose, only one gene is discussed,
      or the direction is mostly restated.
  1 = bad rationale: incorrect gene function, fabricated direct regulation,
      invented promoter binding, or unsupported named intermediates presented as
      fact.
  0 = unusable: label/source/statistical leakage, contradiction, answer-choice
      language, or reasoning unrelated to the requested genes.

  Apply these limits:
  - If the rationale could apply to hundreds of unrelated gene pairs, score <= 2.
  - If either gene is misidentified, score <= 1.
  - If a direct edge, promoter interaction, named response element, or specific
    intermediate is invented as fact, score <= 1.
  - Broad mechanisms such as stress, mTOR, ISR, mitochondrial dysfunction,
    proteostasis, RNA processing, or immune signaling can score >= 3 only when
    tied to concrete functions of {pert} and {gene}.
  - For up/down associations, a plausible sign-producing step is required for
    score >= 3, but the exact intermediate may be uncertain if stated honestly.
  - For no-change associations, precise functional separation can score >= 4
    even without pair-specific evidence.
  - If the rationale mentions labels, answer choices, supplied answers,
    thresholds, FDR, fold changes, statistical significance, training data,
    benchmark information, databases, annotations, GO terms, retrieved context,
    external context, or provided context, score 0.

  Reply with ONLY valid JSON:
  {{"score": <int>, "reason": "<15 words or fewer, naming the main defect>"}}

leak_patterns:
  - '\bgiven\s+(?:that|the)\s+(?:the\s+)?(?:answer|label|outcome|result|ground.?truth|conclusion)'
  - '\b(?:the|this)\s+(?:answer|label|outcome|response)\s+(?:is|was)\s+(?:given|provided|known|stated)'
  - '\bwe\s+(?:are told|know|were told)\s+that\b'
  - '\b(?:since|because|as)\s+(?:the\s+)?(?:correct\s+)?(?:answer|choice|label|outcome)\s+(?:is|was)\b'
  - '\bground.?truth\b'
  - '\bcorrect\s+(?:answer|label|choice)\b'
  - '\b(?:given|provided|supplied)\s+(?:answer|label|response|outcome)\b'
  - '\btraining\s+(?:screen|label|response|example|data)\b'
  - '\bbenchmark\s+threshold\b'
  - '\bbenchmark\b'
  - '\bFDR\b'
  - '\bfalse\s+discovery\s+rate\b'
  - '\blog2\s*(?:fold\s*change|FC)\b'
  - '\blog2FC\b'
  - '\bstatistically\s+significant\b'
  - '\bsignificant(?:ly)?\s+(?:increased|decreased|changed|upregulated|downregulated)\b'
  - '\bobserved\s+(?:increase|decrease|effect|response|change)\b'
  - '\bthe\s+provided\s+context\b'
  - '\bprovided\s+context\b'
  - '\bretrieved\s+(?:context|evidence|information)\b'
  - '\bexternal\s+context\b'
  - '\bdatabase(?:s)?\b'
  - '\bannotation(?:s)?\b'
  - '\bGO\s+terms?\b'
