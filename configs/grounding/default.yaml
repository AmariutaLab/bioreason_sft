# Build biological grounding for the TEACHER prompt and the GRPO verifier.
# Runs offline at data-prep time — legal under Track C, which forbids tools at
# INFERENCE only.

species: mouse

sources:
  # mygene.info: free, no API key. Gives gene name + RefSeq summary (specific
  # FUNCTION) + GO terms. SynthPert's audit found gene-level function is what
  # generalizes; GO super-pathways correlate with WRONG answers. So we lead with
  # summary and keep GO short.
  mygene:
    enabled: true
    batch_size: 200          # symbols per POST
    sleep: 0.2               # be polite to the free endpoint
    max_summary_chars: 600   # truncate; long summaries bloat the teacher prompt
    max_go_terms: 6          # keep GO as a hint, not the main event

  # CollecTRI: SIGNED TF->target regulons (43,175 edges / 1,186 TFs in human;
  # mouse available). The highest-value source, because the sign gives DIRECTION:
  #   knock down an ACTIVATOR -> target DOWN
  #   knock down a  REPRESSOR -> target UP
  # That is DIR-AUROC, the metric half even SOTA only reaches ~0.65-0.73 on.
  # Low recall by design (high precision).
  collectri:
    enabled: true
    # http      = fetch from OmniPath's REST API with plain requests (DEFAULT).
    # decoupler = use the decoupler library if you have it.
    # We default to http because decoupler drags in numba, whose resolver
    # backtracks to numba 0.53.1 (no Python 3.12 wheel -> sdist build ->
    # "only versions >=3.6,<3.10 are supported"). We used decoupler for exactly
    # one download, so we just do the download.
    method: http
    # OmniPath is built from human data and orthology-translates on request, so
    # the mouse query is the expensive server-side path — the one that 502s. If
    # mouse fails, fall back to human edges matched by SYMBOL (every symbol here
    # is upper-cased before lookup, so MYC matches Myc). Roughly the same
    # homology mapping, done client-side. Disclose it if you use it.
    fallback_to_human: true
    # Prefer the static CollecTRI CSV mirror. It is a different host from the
    # OmniPath REST API, so it continues to work during REST 502 outages.
    static_mirror: true
    prefer_static_mirror: true
    static_mirror_tries: 2

context:
  # Which fields go into the teacher's context block.
  include_summary: true
  include_go: true
  include_edge: true              # the signed CollecTRI statement
  include_shared_regulators: true # weak "both downstream of same TF" signal