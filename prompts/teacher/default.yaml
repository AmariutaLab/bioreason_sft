# Prompts for the TEACHER (offline trace generation) and the CRITIC (filtering).
# Never seen by the student. Edit freely to run prompt experiments.
#
# Strategy = SynthPert "Approach 2": the teacher is GIVEN the ground-truth label
# and asked to RATIONALIZE it, not predict it. This sidesteps the teacher's own
# error rate — o4-mini scored only ~52% on this task, yet its traces trained an
# 8B student to ~89%.
#
# Placeholders: {context} {pert} {gene} {meaning} {rules}

# Appended to both generation prompts. These rules encode the failure modes:
rules: |
  Write SELF-CONTAINED mechanistic reasoning. Hard rules:
  - Never mention databases, annotations, GO, "the provided context", or that
    you were given the answer. The student has NO lookup ability; if you cite a
    source it will learn to fabricate citations.
  - Reason from SPECIFIC gene-level molecular function, not vague pathway
    categories. "X encodes the catalytic subunit of Y, required for Z" is good.
    "Both are involved in immune signalling" is useless. (SynthPert's audit:
    correct traces used gene-level function; wrong ones used GO super-pathways.)
  - Name intermediaries explicitly. Keep the chain short (<=2 steps).
  - Do not reason backward from the conclusion. Build forward to it.
  - If the genes are poorly characterized and no credible mechanism exists, say
    so plainly rather than inventing one.
  - <=200 words. Output ONLY the reasoning prose; no headers, no answer tag.

# For up/down rows.
prompt_de: |
  {context}

  TASK: In mouse BMDMs, CRISPRi knockdown of {pert} causes {gene} to be {meaning}.
  Explain the mechanism that produces this specific outcome, including WHY the
  effect is large enough to clear a |log2FC| >= log2(1.5) threshold at 5% FDR.
  {rules}

# 'none' needs its OWN prompt: explaining absence is a different argument, and a
# lazy "no known link" trace teaches nothing. 55% of labels are 'none', so this
# prompt carries a lot of weight.
prompt_none: |
  {context}

  TASK: In mouse BMDMs, CRISPRi knockdown of {pert} leaves {gene} {meaning}.
  Explain WHY there is no detectable effect. Choose the most plausible concrete
  reason and argue it:
    (a) the genes act in unconnected pathways / different compartments;
    (b) {pert} does not transcriptionally regulate {gene} within 2 steps;
    (c) a real but weak effect is shrunk below the log2(1.5) threshold;
    (d) redundancy or buffering compensates for the knockdown.
  Do not merely assert "no known link" — give the mechanistic argument.
  {rules}

# The critic grades REASONING QUALITY, not correctness (the label is known to be
# right). SynthPert kept only top-graded traces and trained on ~2% of the data,
# beating full-data training.
critic: |
  You are grading the QUALITY OF SCIENTIFIC REASONING in an explanation about a
  CRISPRi knockdown experiment. Do NOT grade whether the conclusion is right —
  the conclusion is known to be correct. Grade only the reasoning.

  Perturbed gene: {pert}   Target gene: {gene}   Outcome: {meaning}

  EXPLANATION:
  {trace}

  Score 1-5:
  5 = specific gene-level molecular function for BOTH genes; explicit, named,
      plausible mechanistic chain; macrophage-relevant; no fabricated facts;
      builds FORWARD to the conclusion.
  4 = solid mechanism, minor vagueness.
  3 = generic pathway-level hand-waving ("both in immune response").
  2 = mostly restates the question, or asserts without mechanism.
  1 = fabricated facts, self-contradiction, cites sources, or reasons BACKWARD
      from the given answer.

  Reply with ONLY a JSON object: {{"score": <int>, "reason": "<8 words>"}}

# Hard reject before the critic even runs. Because the teacher is HANDED the
# answer, traces drift into reasoning backward from it ("since the answer is
# B..."), which teaches the student nothing. This is the #1 failure mode of
# Approach 2. Python regex, case-insensitive.
leak_patterns:
  - '\bgiven\s+(?:that|the)\s+(?:the\s+)?(?:answer|label|outcome|result|ground.?truth|conclusion)'
  - '\b(?:the|this)\s+(?:answer|label|outcome)\s+(?:is|was)\s+(?:given|provided|known|stated)'
  - '\bwe\s+(?:are told|know|were told)\s+that\b'
  - '\b(?:since|because|as)\s+(?:the\s+)?(?:correct\s+)?(?:answer|choice|label|outcome)\s+(?:is|was)\b'
  - '\bas\s+(?:stated|provided|given|specified)\s+(?:above|in the prompt|in the task)\b'
  - '\bground.?truth\b'
  - '\bthe\s+experiment(?:al)?\s+(?:result|outcome)\s+(?:shows|says|is|indicates)\b'
  - '\bworking\s+backward'
  - '\bto\s+(?:explain|justify|rationali[sz]e)\s+(?:this|the)\s+(?:given\s+)?(?:answer|outcome|result)\b'
  - '\bthe\s+(?:stated|provided|expected)\s+(?:answer|outcome)\b'
rules: |
  Write a concise biological rationale that could help a smaller student model
  learn the correct perturbation response. Use the supplied context when it is
  relevant, but do not claim that missing evidence proves no effect. Do not say
  that you were given the answer, do not mention labels or letters, and do not
  use phrases such as "therefore the correct answer is". Reason from biology:
  gene function, regulatory sign, pathway proximity, and uncertainty.

prompt_de: |
  You are creating a training rationale for a CRISPRi perturbation benchmark in
  mouse macrophages.

  Context:
  {context}

  Perturbed gene: {pert}
  Target gene: {gene}
  Observed response to rationalize: {meaning}

  Rules:
  {rules}

  Write only the rationale, 3-6 sentences.

prompt_none: |
  You are creating a training rationale for a CRISPRi perturbation benchmark in
  mouse macrophages.

  Context:
  {context}

  Perturbed gene: {pert}
  Target gene: {gene}
  Observed response to rationalize: {meaning}

  Rules:
  {rules}

  For a no-change case, explain why the perturbation may not strongly affect
  this target in this context. Avoid empty statements like "no known link"; give
  a concrete uncertainty-aware rationale. Write only the rationale, 3-6
  sentences.

critic: |
  Score this rationale for whether it is useful training data for a student
  model. Good rationales discuss specific gene biology or signed regulation and
  do not leak that the answer was provided.

  Perturbed gene: {pert}
  Target gene: {gene}
  Intended response: {meaning}
  Rationale:
  {trace}

  Return JSON only: {{"score": 0-5, "reason": "short reason"}}

leak_patterns:
  - "given the answer"
  - "provided answer"
  - "known label"
  - "correct label"
  - "correct answer"
  - "answer is [ABC]"
  - "letter [ABC]"
  - "class [ABC]"
  - "therefore it is (up|down|none)"
  - "must be classified as"
